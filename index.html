<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wayblock - Quoridor Game</title>
  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: #161d2a;
      --card-border: #232d3f;
      --accent-gold: #f59e0b;
      --accent-blue: #2563eb;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --green-online: #10b981;
      --board-bg: #0f172a;
      --cell-bg: #1e293b;
      --p1-color: #10b981;
      --p2-color: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Screen Management */
    .screen { display: none; flex-direction: column; gap: 14px; }
    .screen.active { display: flex; }

    /* Header Profile */
    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }

    .user-info { display: flex; align-items: center; gap: 10px; }
    
    .avatar-logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      border: 2px solid #38ef7d;
      color: #fff;
    }

    .user-details { display: flex; flex-direction: column; }
    .brand-name { font-size: 10px; letter-spacing: 1px; color: var(--text-sub); font-weight: 700; }
    .username { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 5px; }

    .profile-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Main Menu Cards */
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
    }

    .badge-online {
      background: rgba(16, 185, 129, 0.15);
      color: var(--green-online);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-online::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--green-online);
      border-radius: 50%;
    }

    .badge-streak {
      font-size: 12px;
      color: var(--accent-gold);
      font-weight: 700;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.2s ease;
    }

    .card:active { transform: scale(0.98); }

    .card-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title { font-size: 18px; font-weight: 800; margin-bottom: 2px; }
    .card-sub { font-size: 12px; color: var(--text-sub); }

    .card-arrow {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .reward-card {
      border: 1px solid #785213;
      background: linear-gradient(90deg, #2a1f0d 0%, #161d2a 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .reward-info { display: flex; align-items: center; gap: 12px; }
    .reward-icon { font-size: 20px; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .mode-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mode-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    /* Game Screen Elements */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: 14px;
    }

    .btn {
      background: var(--card-border);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(9, 1fr 10px);
      grid-template-rows: repeat(9, 1fr 10px);
      background: var(--board-bg);
      padding: 8px;
      border-radius: 16px;
      aspect-ratio: 1;
      border: 1px solid var(--card-border);
    }

    .cell {
      background: var(--cell-bg);
      border-radius: 6px;
      cursor: pointer;
      position: relative;
    }

    .controls {
      display: flex;
      gap: 8px;
      background: var(--card-bg);
      padding: 8px;
      border-radius: 14px;
    }

    .controls .btn { flex: 1; }
    .btn.active { background: var(--accent-blue); }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- 1. MAIN MENU SCREEN -->
    <div id="screen-menu" class="screen active">
      
      <!-- Profile Header -->
      <div class="profile-header">
        <div class="user-info">
          <div class="avatar-logo">W/B</div>
          <div class="user-details">
            <span class="brand-name">WAYBLOCK</span>
            <span class="username">fhsnov545 🇦🇿</span>
          </div>
        </div>
        <button class="profile-btn">👤</button>
      </div>

      <!-- Main Banner Card -->
      <div class="card" style="background: linear-gradient(180deg, #1e293b 0%, #161d2a 100%);">
        <div class="status-row">
          <span class="badge-online">ONLINE</span>
          <span class="badge-streak">🔥 Best Streak: 3</span>
        </div>
        <div class="card-main" style="margin-top: 10px;">
          <div>
            <div class="card-title">Play Online</div>
            <div class="card-sub">Ranked matches</div>
          </div>
          <div class="card-arrow">→</div>
        </div>
      </div>

      <!-- Daily Reward Banner -->
      <div class="card reward-card">
        <div class="reward-info">
          <span class="reward-icon">🎁</span>
          <div>
            <div style="font-size: 13px; font-weight: 700; color: var(--accent-gold);">Daily reward ready +50</div>
            <div style="font-size: 10px; color: var(--text-sub); margin-top: 2px;">● ◌ ◌ ◌ ◌ ◌ ◌ &nbsp; 1/7</div>
          </div>
        </div>
        <span style="color: var(--accent-gold); font-size: 14px;">›</span>
      </div>

      <!-- Game Modes Grid -->
      <div class="grid-2">
        <div class="card mode-card" onclick="startGame('computer')">
          <div class="mode-icon">🤖</div>
          <div>
            <div class="card-title" style="font-size: 15px;">Play vs Computer</div>
            <div class="card-sub">Single Player</div>
          </div>
        </div>

        <div class="card mode-card" onclick="startGame('two_players')">
          <div class="mode-icon">👥</div>
          <div>
            <div class="card-title" style="font-size: 15px;">Two Players</div>
            <div class="card-sub">Same Device</div>
          </div>
        </div>
      </div>

      <!-- Leaderboard Card -->
      <div class="card card-main">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="font-size: 18px;">🏆</span>
          <span style="font-weight: 700; font-size: 15px;">Leaderboard</span>
        </div>
        <span style="color: var(--text-sub);">›</span>
      </div>

    </div>

    <!-- 2. GAME PLAY SCREEN -->
    <div id="screen-game" class="screen">
      <div class="top-bar">
        <button class="btn" onclick="showMenu()">←</button>
        <button class="btn" id="mode-badge">🤖 Hard</button>
        <button class="btn" id="reset-btn">🔄</button>
      </div>

      <div class="top-bar" style="font-size: 13px;">
        <div id="turn-indicator">🟢 Sizin növbəniz</div>
        <div>HESAB <span id="score">0 - 0</span></div>
        <div>
          <span style="color:var(--p1-color)">❚</span> <span id="p1-walls">10</span> 
          <span style="color:var(--p2-color)">❚</span> <span id="p2-walls">8</span>
        </div>
      </div>

      <!-- Quoridor Board Grid -->
      <div class="board" id="board"></div>

      <!-- Control Buttons -->
      <div class="controls">
        <button class="btn active" id="mode-move">🏃 Hərəkət</button>
        <button class="btn" id="mode-h">▬ Yatay</button>
        <button class="btn" id="mode-v">❚ Dikey</button>
      </div>
    </div>

  </div>

  <script>
    function startGame(mode) {
      document.getElementById('screen-menu').classList.remove('active');
      document.getElementById('screen-game').classList.add('active');
      document.getElementById('mode-badge').innerText = mode === 'computer' ? '🤖 vs Kompüter' : '👥 2 Nəfərlik';
    }

    function showMenu() {
      document.getElementById('screen-game').classList.remove('active');
      document.getElementById('screen-menu').classList.add('active');
    }
  </script>
</body>
</html>
