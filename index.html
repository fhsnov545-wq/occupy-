<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wayblock - Quoridor MultiPlayer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f17;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 12px;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
        }

        .screen { display: none; flex-direction: column; gap: 14px; width: 100%; }
        .screen.active { display: flex; }

        .screen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }

        .header-title { font-size: 18px; font-weight: 800; }

        .icon-btn-rounded {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #161926;
            border: 1px solid #23283b;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .login-card {
            background: #161926;
            border: 1px solid #23283b;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .username-input {
            width: 100%;
            padding: 12px;
            background: #0b0f17;
            border: 1px solid #23283b;
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            text-align: center;
            outline: none;
            user-select: auto;
            -webkit-user-select: auto;
        }

        .username-input:focus { border-color: #38ef7d; }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }

        .user-info { display: flex; align-items: center; gap: 10px; }
        
        .avatar-logo {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #23283b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 16px;
            border: 2px solid #323952;
            color: #38ef7d;
            text-transform: uppercase;
        }

        .user-details { display: flex; flex-direction: column; }
        .brand-name { font-size: 10px; letter-spacing: 1px; color: #6c757d; font-weight: 700; }
        .username { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 5px; }

        .menu-card {
            background: #161926;
            border: 1px solid #23283b;
            border-radius: 18px;
            padding: 16px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .menu-card:active { transform: scale(0.98); }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .badge-online {
            background: rgba(56, 239, 125, 0.15);
            color: #38ef7d;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-online::before {
            content: "";
            width: 6px;
            height: 6px;
            background: #38ef7d;
            border-radius: 50%;
        }

        .badge-streak { font-size: 12px; color: #f59e0b; font-weight: 700; }
        .card-main-title { font-size: 18px; font-weight: 800; margin-bottom: 2px; }
        .card-sub { font-size: 12px; color: #6c757d; }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .mode-card { display: flex; flex-direction: column; gap: 12px; }

        .mode-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* DIFFICULTY STYLES */
        .diff-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: #161926;
            border: 1px solid #23283b;
            border-radius: 14px;
            padding: 6px;
        }

        .diff-btn {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: #0b0f17;
            color: #8c96a8;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .diff-btn.active[data-diff="easy"] { background: rgba(56, 239, 125, 0.15); color: #38ef7d; border-color: #38ef7d; }
        .diff-btn.active[data-diff="medium"] { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border-color: #f59e0b; }
        .diff-btn.active[data-diff="hard"] { background: rgba(239, 68, 68, 0.15); color: #ef4444; border-color: #ef4444; }
        .diff-btn.active[data-diff="master"] { background: rgba(168, 85, 247, 0.15); color: #a855f7; border-color: #a855f7; }

        .mode-toggle-container, .player-count-container {
            display: flex;
            background: #161926;
            border: 1px solid #23283b;
            border-radius: 14px;
            padding: 4px;
            gap: 4px;
        }

        .mode-toggle-btn, .player-count-btn {
            flex: 1;
            padding: 8px 4px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: #6c757d;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .mode-toggle-btn.active {
            background: #23283b;
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .player-count-btn.active {
            background: #38ef7d;
            color: #0b0f17;
        }

        .player-setup-card {
            background: #161926;
            border: 1px solid #23283b;
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-setup-header { display: flex; justify-content: space-between; align-items: center; }
        .player-badge {
            width: 26px; height: 26px; border-radius: 50%;
            background: #23283b; display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 12px;
        }

        .color-palette { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
        .color-circle {
            width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent;
        }
        .color-circle.selected { transform: scale(1.15); border-color: #ffffff; }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .icon-btn {
            background: #161926;
            border: 1px solid #23283b;
            color: #a0a6b8;
            width: 38px; height: 38px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 16px;
        }

        .game-mode-indicator {
            background: #161926;
            border: 1px solid #23283b;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px; font-weight: 700;
            display: flex; align-items: center; gap: 8px;
        }

        .card-game-info {
            background: #161926;
            border: 1px solid #23283b;
            border-radius: 14px;
            padding: 10px 14px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 13px; font-weight: 700;
        }

        .turn-info { display: flex; align-items: center; gap: 8px; }
        .dot-indicator {
            width: 10px; height: 10px; border-radius: 50%;
            background-color: #38ef7d; box-shadow: 0 0 8px #38ef7d;
        }

        .wall-counters { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
        .wall-pill {
            background: #1f2436; padding: 2px 6px; border-radius: 6px;
            display: flex; align-items: center; gap: 4px; font-size: 11px;
            border: 1px solid #2d344b;
        }

        .wall-pill-icon { width: 3px; height: 10px; border-radius: 2px; }

        #board-wrapper {
            position: relative;
            background: #161926;
            border: 1px solid #23283b;
            border-radius: 16px;
            padding: 10px;
            display: flex; flex-direction: column; align-items: center;
            touch-action: none;
        }

        .finish-banner {
            display: none; width: 340px; text-align: center; padding: 6px; margin-bottom: 8px;
            background: rgba(56, 239, 125, 0.1); border: 1px dashed #38ef7d;
            border-radius: 8px; font-size: 12px; font-weight: 800; color: #38ef7d; letter-spacing: 2px;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 10px;
            width: 340px; height: 340px;
            position: relative;
        }

        .cell {
            background: #23293e; border-radius: 6px; position: relative;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        .cell.center-cell::before { content: "👑"; font-size: 16px; opacity: 0.8; }
        .cell.finish-cell { background: rgba(56, 239, 125, 0.12); border: 1px dashed #38ef7d; }

        .cell.valid-move {
            background: rgba(56, 239, 125, 0.15);
            border: 1px dashed rgba(56, 239, 125, 0.5);
        }

        .cell.valid-move::after {
            content: ''; width: 8px; height: 8px; border-radius: 50%;
            background: #38ef7d; box-shadow: 0 0 6px #38ef7d;
        }

        .pawn {
            width: 65%; height: 65%; border-radius: 50%;
            position: absolute; transition: all 0.25s ease; z-index: 5;
        }

        .wall-placed {
            position: absolute; border-radius: 3px; z-index: 10;
            box-shadow: 0 0 8px rgba(230, 126, 34, 0.6);
        }

        .controls { display: flex; gap: 10px; width: 100%; }

        .btn-mode {
            flex: 1; padding: 12px; background: #161926; border: 1px solid #23283b;
            color: #8c96a8; border-radius: 12px; font-weight: 700; font-size: 13px;
            display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
        }

        .btn-mode.active {
            background: #2563eb; color: #ffffff; border-color: #3b82f6;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); display: flex; align-items: center;
            justify-content: center; z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal {
            background: #181b29; border: 1px solid #2a3148;
            border-radius: 20px; padding: 24px; text-align: center;
            max-width: 320px; width: 90%;
        }

        .modal h2 { font-size: 20px; margin-bottom: 10px; }
        .modal p { color: #a0a6b8; font-size: 14px; margin-bottom: 20px; }

        .modal-btn {
            background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff;
            border: none; padding: 12px 24px; border-radius: 10px;
            font-weight: 700; font-size: 14px; cursor: pointer; width: 100%;
        }
    </style>
</head>
<body>

  <div class="app-container">

    <!-- LOGIN SCREEN -->
    <div id="screen-login" class="screen active">
      <div style="text-align: center; margin-top: 30px;">
        <h1 style="font-size: 28px; font-weight: 900; letter-spacing: 2px;">WAYBLOCK</h1>
        <p style="color: #6c757d; font-size: 13px; margin-top: 4px;">Quoridor Game</p>
      </div>

      <div class="login-card" style="margin-top: 20px;">
        <div class="avatar-logo" style="width: 60px; height: 60px; font-size: 24px;">🎮</div>
        <input type="text" id="input-username" class="username-input" placeholder="İstifadəçi adınızı yazın..." maxlength="15">
        <button class="btn-submit" onclick="loginUser()">Oyuna Başla</button>
      </div>
    </div>

    <!-- MAIN MENU -->
    <div id="screen-menu" class="screen">
      <div class="profile-header">
        <div class="user-info">
          <div class="avatar-logo" id="user-avatar">👤</div>
          <div class="user-details">
            <span class="brand-name">WAYBLOCK</span>
            <span class="username" id="display-username">Oyunçu</span>
          </div>
        </div>
      </div>

      <div class="grid-2" style="margin-top: 10px;">
        <div class="menu-card mode-card" onclick="openSetup('vs_bot')">
          <div class="mode-icon">🤖</div>
          <div>
            <div class="card-main-title" style="font-size: 15px;">Bot ilə Oyna</div>
            <div class="card-sub">Tək Oyunçu</div>
          </div>
        </div>

        <div class="menu-card mode-card" onclick="openSetup('multi_players')">
          <div class="mode-icon">👥</div>
          <div>
            <div class="card-main-title" style="font-size: 15px;">Çox Oyunçu</div>
            <div class="card-sub">2-4 Oyunçu</div>
          </div>
        </div>
      </div>
    </div>

    <!-- SETUP SCREEN -->
    <div id="screen-pass-setup" class="screen">
      <div class="screen-header">
        <button class="icon-btn-rounded" onclick="navigateTo('screen-menu')">←</button>
        <div style="text-align: center;">
            <div class="header-title" id="setup-title">Oyun Tənzimləmələri</div>
        </div>
        <div></div>
      </div>

      <!-- BOT DIFFICULTY SELECTOR -->
      <div id="diff-box-wrapper" style="display: none;">
        <div style="font-size: 11px; color: #6c757d; font-weight: 800; margin-bottom: 4px;">ÇƏTİNLİK DƏRƏCƏSİ</div>
        <div class="diff-container">
            <button class="diff-btn active" data-diff="easy" onclick="setBotDiff('easy')">📊 Easy</button>
            <button class="diff-btn" data-diff="medium" onclick="setBotDiff('medium')">📊 Medium</button>
            <button class="diff-btn" data-diff="hard" onclick="setBotDiff('hard')">📊 Hard</button>
            <button class="diff-btn" data-diff="master" onclick="setBotDiff('master')">👑 Master</button>
        </div>
      </div>

      <!-- Player Count Selector -->
      <div class="player-count-container" id="player-count-box">
        <button class="player-count-btn active" id="btn-count-2" onclick="setPlayerCount(2)">2 Oyunçu</button>
        <button class="player-count-btn" id="btn-count-3" onclick="setPlayerCount(3)">3 Oyunçu</button>
        <button class="player-count-btn" id="btn-count-4" onclick="setPlayerCount(4)">4 Oyunçu</button>
      </div>

      <!-- Mode Selector -->
      <div class="mode-toggle-container">
        <button class="mode-toggle-btn active" id="btn-mode-classic" onclick="setGameRule('classic')">🚩 Classic</button>
        <button class="mode-toggle-btn" id="btn-mode-center" onclick="setGameRule('center_race')">👑 Center</button>
        <button class="mode-toggle-btn" id="btn-mode-finish" onclick="setGameRule('finish_race')">🏁 Finish</button>
      </div>

      <div id="players-config-list" style="display: flex; flex-direction: column; gap: 10px; max-height: 240px; overflow-y: auto;"></div>

      <button class="btn-submit" style="margin-top: 6px;" onclick="confirmAndStartGame()">Oyuna Başla</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="screen-game" class="screen">
      <div class="game-header">
        <button class="icon-btn" onclick="navigateTo('screen-menu')">←</button>
        <div class="game-mode-indicator" id="game-mode-title">🤖 vs Bot</div>
        <button class="icon-btn" onclick="restartGame()">🔄</button>
      </div>

      <div class="card-game-info">
        <div class="turn-info">
          <div class="dot-indicator" id="turn-dot"></div>
          <span id="turn-text">Sizin növbəniz</span>
        </div>
        <div class="wall-counters" id="wall-counters-container"></div>
      </div>

      <div id="board-wrapper">
        <div class="finish-banner" id="finish-banner">🏁 FINISH ZOLAĞI 🏁</div>
        <div id="board"></div>
      </div>

      <div class="controls">
        <button class="btn-mode active" id="btn-move" onclick="setMode('move')">🏃 Hərəkət</button>
        <button class="btn-mode" id="btn-h" onclick="setMode('H')">▬ Yatay</button>
        <button class="btn-mode" id="btn-v" onclick="setMode('V')">❚ Dikey</button>
      </div>
    </div>

  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal">
      <div class="modal">
          <h2 id="modal-title">Qələbə!</h2>
          <p id="modal-desc">Siz qazandınız!</p>
          <button class="modal-btn" onclick="restartGame()">Yenidən Başla</button>
      </div>
  </div>

<script>
    let currentUser = { name: "Oyunçu" };

    const COLOR_OPTIONS = ['#5865F2', '#E74C3C', '#2ECC71', '#F1C40F', '#E91E63', '#00BCD4'];

    let gameSetup = {
        mode: 'vs_bot',
        botDiff: 'easy', // 'easy', 'medium', 'hard', 'master'
        playerCount: 2,
        rule: 'classic',
        players: [
            { name: 'Oyunçu 1', color: '#5865F2' },
            { name: 'Bot', color: '#E74C3C' },
            { name: 'Oyunçu 3', color: '#2ECC71' },
            { name: 'Oyunçu 4', color: '#F1C40F' }
        ]
    };

    window.onload = function() {
        let saved = localStorage.getItem('wayblock_user');
        if(saved) currentUser = JSON.parse(saved);
        document.getElementById('display-username').textContent = currentUser.name;
        navigateTo('screen-menu');
    };

    function loginUser() {
        let name = document.getElementById('input-username').value.trim();
        if(name) currentUser.name = name;
        localStorage.setItem('wayblock_user', JSON.stringify(currentUser));
        document.getElementById('display-username').textContent = currentUser.name;
        navigateTo('screen-menu');
    }

    function openSetup(mode) {
        gameSetup.mode = mode;
        gameSetup.players[0].name = currentUser.name;

        document.getElementById('diff-box-wrapper').style.display = mode === 'vs_bot' ? 'block' : 'none';
        document.getElementById('player-count-box').style.display = mode === 'vs_bot' ? 'none' : 'flex';

        renderPlayersSetupUI();
        navigateTo('screen-pass-setup');
    }

    function setBotDiff(diff) {
        gameSetup.botDiff = diff;
        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.diff === diff);
        });
    }

    function setPlayerCount(count) {
        gameSetup.playerCount = count;
        document.getElementById('btn-count-2').classList.toggle('active', count === 2);
        document.getElementById('btn-count-3').classList.toggle('active', count === 3);
        document.getElementById('btn-count-4').classList.toggle('active', count === 4);
        renderPlayersSetupUI();
    }

    function setGameRule(rule) {
        gameSetup.rule = rule;
        document.getElementById('btn-mode-classic').classList.toggle('active', rule === 'classic');
        document.getElementById('btn-mode-center').classList.toggle('active', rule === 'center_race');
        document.getElementById('btn-mode-finish').classList.toggle('active', rule === 'finish_race');
    }

    function renderPlayersSetupUI() {
        const container = document.getElementById('players-config-list');
        container.innerHTML = '';

        let count = gameSetup.mode === 'vs_bot' ? 2 : gameSetup.playerCount;

        for (let i = 0; i < count; i++) {
            let p = gameSetup.players[i];
            let isBot = (gameSetup.mode === 'vs_bot' && i === 1);

            let card = document.createElement('div');
            card.className = 'player-setup-card';
            card.innerHTML = `
                <div class="player-setup-header">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <div class="player-badge" style="background: ${p.color}; color: #fff;">${i + 1}</div>
                        <div style="font-size: 13px; font-weight: 800;">${isBot ? 'Bot (' + gameSetup.botDiff.toUpperCase() + ')' : 'Oyunçu ' + (i + 1)}</div>
                    </div>
                </div>
                <input type="text" id="p-name-input-${i}" class="username-input" style="text-align: left; padding: 6px 10px; font-size: 12px;" 
                       value="${isBot ? 'Bot' : p.name}" ${isBot ? 'disabled' : ''}>
            `;
            container.appendChild(card);
        }
    }

    function confirmAndStartGame() {
        let count = gameSetup.mode === 'vs_bot' ? 2 : gameSetup.playerCount;
        for (let i = 0; i < count; i++) {
            let inp = document.getElementById(`p-name-input-${i}`);
            if (inp && inp.value.trim()) gameSetup.players[i].name = inp.value.trim();
        }
        startGame(gameSetup.mode);
    }

    // GAME ENGINE
    const BOARD_SIZE = 9;
    let players = [];
    let turnIndex = 0;
    let activeMode = 'move';
    let currentGameMode = 'vs_bot';

    let hWalls = Array(8).fill(0).map(() => Array(8).fill(false));
    let vWalls = Array(8).fill(0).map(() => Array(8).fill(false));

    let boardEl = document.getElementById('board');

    function navigateTo(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function startGame(mode) {
        currentGameMode = mode;
        navigateTo('screen-game');
        document.getElementById('game-mode-title').innerHTML = mode === 'vs_bot' ? `🤖 Bot (${gameSetup.botDiff.toUpperCase()})` : '👥 Çok Oyunçu';
        restartGame();
    }

    function initBoard() {
        boardEl.innerHTML = '';
        document.getElementById('finish-banner').style.display = (gameSetup.rule === 'finish_race') ? 'block' : 'none';

        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                if(gameSetup.rule === 'center_race' && r === 4 && c === 4) cell.classList.add('center-cell');
                if(gameSetup.rule === 'finish_race' && r === 0) cell.classList.add('finish-cell');
                cell.dataset.r = r; cell.dataset.c = c;
                cell.onclick = () => onCellClick(r, c);
                boardEl.appendChild(cell);
            }
        }
        renderPawns();
        updateUI();
    }

    function renderPawns() {
        document.querySelectorAll('.pawn').forEach(p => p.remove());
        players.forEach(p => {
            let cell = getCellEl(p.r, p.c);
            if (cell) {
                let pawn = document.createElement('div');
                pawn.className = 'pawn';
                pawn.style.background = `radial-gradient(circle at 30% 30%, #ffffff, ${p.color})`;
                cell.appendChild(pawn);
            }
        });
        highlightValidMoves();
    }

    function getCellEl(r, c) { return document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`); }

    function highlightValidMoves() {
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('valid-move'));
        if (currentGameMode === 'vs_bot' && turnIndex !== 0) return;
        if (activeMode !== 'move') return;

        let moves = getValidMoves(players[turnIndex], hWalls, vWalls, players);
        moves.forEach(m => {
            let el = getCellEl(m.r, m.c);
            if (el) el.classList.add('valid-move');
        });
    }

    function getValidMoves(p, currentHWalls, currentVWalls, currentPlayers) {
        let moves = [];
        let dr = [-1, 1, 0, 0];
        let dc = [0, 0, -1, 1];

        for (let i = 0; i < 4; i++) {
            let nr = p.r + dr[i];
            let nc = p.c + dc[i];

            if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                if (!isWallBetween(p.r, p.c, nr, nc, currentHWalls, currentVWalls)) {
                    let occupied = currentPlayers.find(other => other.r === nr && other.c === nc);
                    if (occupied) {
                        let jx = nr + dr[i];
                        let jy = nc + dc[i];
                        if (jx >= 0 && jx < BOARD_SIZE && jy >= 0 && jy < BOARD_SIZE && !isWallBetween(nr, nc, jx, jy, currentHWalls, currentVWalls)) {
                            moves.push({ r: jx, c: jy });
                        }
                    } else {
                        moves.push({ r: nr, c: nc });
                    }
                }
            }
        }
        return moves;
    }

    function isWallBetween(r1, c1, r2, c2, hw, vw) {
        if (r1 === r2) {
            let minC = Math.min(c1, c2);
            if (r1 > 0 && vw[r1 - 1][minC]) return true;
            if (r1 < 8 && vw[r1][minC]) return true;
        } else if (c1 === c2) {
            let minR = Math.min(r1, r2);
            if (c1 > 0 && hw[minR][c1 - 1]) return true;
            if (c1 < 8 && hw[minR][c1]) return true;
        }
        return false;
    }

    function onCellClick(r, c) {
        if (currentGameMode === 'vs_bot' && turnIndex !== 0) return;

        let currP = players[turnIndex];

        if (activeMode === 'move') {
            let moves = getValidMoves(currP, hWalls, vWalls, players);
            if (moves.some(m => m.r === r && m.c === c)) {
                currP.r = r; currP.c = c;
                if (checkWin(currP)) return endGame(currP);
                switchTurn();
            }
        } else {
            let wr = r < 8 ? r : 7;
            let wc = c < 8 ? c : 7;
            if (canPlaceWall(wr, wc, activeMode, hWalls, vWalls, currP)) {
                placeWallUI(wr, wc, activeMode, currP.color);
                if (activeMode === 'H') hWalls[wr][wc] = true;
                else vWalls[wr][wc] = true;

                currP.walls--;
                setMode('move');
                switchTurn();
            }
        }
    }

    function checkWin(p) {
        if (gameSetup.rule === 'center_race') return p.r === 4 && p.c === 4;
        if (gameSetup.rule === 'finish_race') return p.r === 0;
        if (p.targetSide === 'top') return p.r === 0;
        if (p.targetSide === 'bottom') return p.r === 8;
        return false;
    }

    function setMode(mode) {
        activeMode = mode;
        document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${mode.toLowerCase()}`).classList.add('active');
        highlightValidMoves();
    }

    function canPlaceWall(r, c, type, hw, vw, player) {
        if (player.walls <= 0) return false;
        if (r < 0 || r >= 8 || c < 0 || c >= 8) return false;

        if (type === 'H') {
            if (hw[r][c] || (c > 0 && hw[r][c - 1]) || (c < 7 && hw[r][c + 1]) || vw[r][c]) return false;
        } else {
            if (vw[r][c] || (r > 0 && vw[r - 1][c]) || (r < 7 && vw[r + 1][c]) || hw[r][c]) return false;
        }

        // BFS path check (Path trapping prevention)
        let tempHW = hw.map(row => [...row]);
        let tempVW = vw.map(row => [...row]);
        if (type === 'H') tempHW[r][c] = true;
        else tempVW[r][c] = true;

        for (let p of players) {
            if (getShortestPathLength(p, tempHW, tempVW) === Infinity) return false;
        }

        return true;
    }

    function placeWallUI(r, c, type, color) {
        let wallEl = document.createElement('div');
        wallEl.className = 'wall-placed';
        wallEl.style.background = color;
        
        let cellW = (340 - 80) / 9;
        let gap = 10;

        if (type === 'H') {
            wallEl.style.width = `${cellW * 2 + gap}px`;
            wallEl.style.height = `8px`;
            wallEl.style.left = `${10 + c * (cellW + gap)}px`;
            wallEl.style.top = `${10 + (r + 1) * cellW + r * gap + 1}px`;
        } else {
            wallEl.style.width = `8px`;
            wallEl.style.height = `${cellW * 2 + gap}px`;
            wallEl.style.left = `${10 + (c + 1) * cellW + c * gap + 1}px`;
            wallEl.style.top = `${10 + r * (cellW + gap)}px`;
        }

        boardEl.appendChild(wallEl);
    }

    function switchTurn() {
        turnIndex = (turnIndex + 1) % players.length;
        updateUI();
        renderPawns();

        if (currentGameMode === 'vs_bot' && turnIndex === 1) {
            setTimeout(executeAITurn, 350);
        }
    }

    function updateUI() {
        let wallContainer = document.getElementById('wall-counters-container');
        wallContainer.innerHTML = '';
        players.forEach((p) => {
            let pill = document.createElement('div');
            pill.className = 'wall-pill';
            pill.innerHTML = `<div class="wall-pill-icon" style="background: ${p.color}"></div><span>${p.walls}</span>`;
            wallContainer.appendChild(pill);
        });

        let currP = players[turnIndex];
        let dot = document.getElementById('turn-dot');
        dot.style.backgroundColor = currP.color;
        document.getElementById('turn-text').textContent = `${currP.name} Sırası`;
    }

    /* AI ALGORITHMS (BFS / SMART STRATEGY) */
    function getShortestPathLength(player, hw, vw) {
        let queue = [{ r: player.r, c: player.c, dist: 0 }];
        let visited = Array(9).fill(0).map(() => Array(9).fill(false));
        visited[player.r][player.c] = true;

        while (queue.length > 0) {
            let curr = queue.shift();

            if (gameSetup.rule === 'center_race' && curr.r === 4 && curr.c === 4) return curr.dist;
            if (gameSetup.rule === 'finish_race' && curr.r === 0) return curr.dist;
            if (gameSetup.rule === 'classic') {
                if (player.targetSide === 'bottom' && curr.r === 8) return curr.dist;
                if (player.targetSide === 'top' && curr.r === 0) return curr.dist;
            }

            let tempP = { r: curr.r, c: curr.c };
            let moves = getValidMoves(tempP, hw, vw, []);

            for (let m of moves) {
                if (!visited[m.r][m.c]) {
                    visited[m.r][m.c] = true;
                    queue.push({ r: m.r, c: m.c, dist: curr.dist + 1 });
                }
            }
        }

        return Infinity;
    }

    function executeAITurn() {
        let bot = players[1];
        let human = players[0];
        let diff = gameSetup.botDiff;

        let botDist = getShortestPathLength(bot, hWalls, vWalls);
        let humanDist = getShortestPathLength(human, hWalls, vWalls);

        let shouldPlaceWall = false;

        if (diff === 'easy') {
            shouldPlaceWall = (bot.walls > 0 && Math.random() < 0.25);
        } else if (diff === 'medium') {
            shouldPlaceWall = (bot.walls > 0 && (humanDist < botDist || Math.random() < 0.35));
        } else if (diff === 'hard' || diff === 'master') {
            shouldPlaceWall = (bot.walls > 0 && (humanDist <= botDist || humanDist <= 3));
        }

        let bestWall = null;

        if (shouldPlaceWall) {
            let maxDelay = -99;

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    for (let type of ['H', 'V']) {
                        if (canPlaceWall(r, c, type, hWalls, vWalls, bot)) {
                            let tempHW = hWalls.map(row => [...row]);
                            let tempVW = vWalls.map(row => [...row]);
                            if (type === 'H') tempHW[r][c] = true;
                            else tempVW[r][c] = true;

                            let newHumanDist = getShortestPathLength(human, tempHW, tempVW);
                            let newBotDist = getShortestPathLength(bot, tempHW, tempVW);

                            if (newHumanDist !== Infinity && newBotDist !== Infinity) {
                                let impact = (newHumanDist - humanDist) - (newBotDist - botDist);

                                if (impact > maxDelay && newHumanDist > humanDist) {
                                    maxDelay = impact;
                                    bestWall = { r, c, type };
                                }
                            }
                        }
                    }
                }
            }
        }

        if (bestWall && (diff === 'master' || maxDelay > 0)) {
            placeWallUI(bestWall.r, bestWall.c, bestWall.type, bot.color);
            if (bestWall.type === 'H') hWalls[bestWall.r][bestWall.c] = true;
            else vWalls[bestWall.r][bestWall.c] = true;
            bot.walls--;
            switchTurn();
            return;
        }

        // MOVE LOGIC (BFS BEST MOVE)
        let moves = getValidMoves(bot, hWalls, vWalls, players);
        let bestMove = null;
        let minMoveDist = Infinity;

        for (let m of moves) {
            let tempBot = { ...bot, r: m.r, c: m.c };
            let dist = getShortestPathLength(tempBot, hWalls, vWalls);
            if (dist < minMoveDist) {
                minMoveDist = dist;
                bestMove = m;
            }
        }

        if (bestMove) {
            bot.r = bestMove.r;
            bot.c = bestMove.c;
            if (checkWin(bot)) return endGame(bot);
        }

        switchTurn();
    }

    function endGame(winner) {
        document.getElementById('modal-title').textContent = "Qələbə! 🎉";
        document.getElementById('modal-desc').textContent = `${winner.name} qazandı!`;
        document.getElementById('modal').classList.add('active');
    }

    function restartGame() {
        let count = gameSetup.mode === 'vs_bot' ? 2 : gameSetup.playerCount;
        let initialWalls = count === 2 ? 10 : (count === 3 ? 7 : 5);

        players = [];

        if (gameSetup.rule === 'finish_race') {
            let startCols = count === 2 ? [2, 6] : (count === 3 ? [2, 4, 6] : [1, 3, 5, 7]);
            for (let i = 0; i < count; i++) {
                players.push({ id: i, r: 8, c: startCols[i], walls: initialWalls, name: gameSetup.players[i].name, color: gameSetup.players[i].color, targetSide: 'top' });
            }
        } else {
            players.push({ id: 0, r: 8, c: 4, walls: initialWalls, name: gameSetup.players[0].name, color: gameSetup.players[0].color, targetSide: 'top' });
            players.push({ id: 1, r: 0, c: 4, walls: initialWalls, name: gameSetup.players[1].name, color: gameSetup.players[1].color, targetSide: 'bottom' });
            if (count >= 3) players.push({ id: 2, r: 4, c: 0, walls: initialWalls, name: gameSetup.players[2].name, color: gameSetup.players[2].color, targetSide: 'right' });
            if (count === 4) players.push({ id: 3, r: 4, c: 8, walls: initialWalls, name: gameSetup.players[3].name, color: gameSetup.players[3].color, targetSide: 'left' });
        }

        turnIndex = 0;
        activeMode = 'move';
        hWalls = Array(8).fill(0).map(() => Array(8).fill(false));
        vWalls = Array(8).fill(0).map(() => Array(8).fill(false));
        document.querySelectorAll('.wall-placed').forEach(w => w.remove());
        document.getElementById('modal').classList.remove('active');
        setMode('move');
        initBoard();
    }
</script>
