<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quoridor Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0f12;
            color: #e1e6ed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 880px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            position: relative;
        }

        /* Top Header & Controls */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #181c24;
            border: 1px solid #282e3d;
            color: #8a94a6;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
        }

        .icon-btn:active {
            background: #222834;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        /* Scoreboard & Status Card */
        .status-card {
            background: #14171f;
            border: 1px solid #222735;
            border-radius: 20px;
            padding: 14px 18px;
            margin-top: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .turn-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 15px;
        }

        .turn-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 8px #4ade8080;
        }

        .difficulty-badge {
            background: #2a1b24;
            border: 1px solid #4a222e;
            color: #f87171;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .divider {
            height: 1px;
            background: #222735;
            margin-bottom: 12px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-group {
            display: flex;
            gap: 16px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 10px;
            color: #64748b;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 700;
            color: #cbd5e1;
            margin-top: 2px;
        }

        .wall-counts {
            display: flex;
            gap: 8px;
        }

        .wall-pill {
            background: #1e2430;
            border: 1px solid #2d3546;
            padding: 4px 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
        }

        .wall-icon {
            width: 4px;
            height: 14px;
            border-radius: 2px;
        }

        .wall-pill.p1 .wall-icon { background: #5eead4; }
        .wall-pill.p2 .wall-icon { background: #f87171; }

        /* Board Styling */
        .board-wrapper {
            width: 100%;
            aspect-ratio: 1;
            background: #141822;
            border-radius: 20px;
            border: 1px solid #232938;
            padding: 10px;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .board {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 6px;
            position: relative;
        }

        .cell {
            background: #212736;
            border-radius: 6px;
            position: relative;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .cell.highlight-target {
            background: #1e3a35;
        }

        .cell.highlight-target::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 8px #4ade80;
        }

        .cell.p2-goal {
            background: rgba(248, 113, 113, 0.08);
        }

        .cell.p1-goal {
            background: rgba(94, 234, 212, 0.08);
        }

        .pawn {
            width: 60%;
            height: 60%;
            border-radius: 50%;
            position: absolute;
            top: 20%;
            left: 20%;
            z-index: 5;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .pawn.p1 {
            background: radial-gradient(circle at 30% 30%, #5eead4, #0d9488);
            border: 2px solid #99f6e4;
        }

        .pawn.p2 {
            background: radial-gradient(circle at 30% 30%, #f87171, #dc2626);
            border: 2px solid #fca5a5;
        }

        /* Walls Layer */
        .walls-container {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            pointer-events: none;
            z-index: 10;
        }

        .placed-wall {
            position: absolute;
            background: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            border-radius: 3px;
        }

        /* Controls / Wall Selection */
        .instruction-text {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
            letter-spacing: 0.2px;
            margin-bottom: 8px;
        }

        .wall-controls {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .mode-btn {
            flex: 1;
            height: 52px;
            background: #14171f;
            border: 1px solid #222735;
            border-radius: 16px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: #1e2430;
            border-color: #3b82f6;
            color: #f8fafc;
        }

        .wall-icon-btn {
            width: 20px;
            height: 4px;
            background: #94a3b8;
            border-radius: 2px;
        }

        .wall-icon-btn.vertical {
            width: 4px;
            height: 20px;
        }

        /* Modal / Game Settings overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 7, 10, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #12151e;
            border: 1px solid #232938;
            border-radius: 24px;
            width: 100%;
            max-width: 360px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .modal-title-group {
            display: flex;
            flex-direction: column;
        }

        .modal-subtitle {
            font-size: 11px;
            color: #d97706;
            font-weight: 700;
            text-transform: uppercase;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #f1f5f9;
        }

        .section-label {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .grid-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .opt-btn {
            background: #181c27;
            border: 1px solid #262d3d;
            border-radius: 12px;
            padding: 12px;
            color: #94a3b8;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .opt-btn.active {
            background: #1e293b;
            border-color: #38bdf8;
            color: #38bdf8;
        }

        .opt-btn.master.active {
            background: #2a2015;
            border-color: #f59e0b;
            color: #f59e0b;
        }

        .round-selector {
            display: flex;
            background: #181c27;
            border: 1px solid #262d3d;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .round-opt {
            flex: 1;
            text-align: center;
            padding: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            border-radius: 8px;
            cursor: pointer;
        }

        .round-opt.active {
            background: #262e3f;
            color: #f1f5f9;
        }

        .start-btn {
            width: 100%;
            height: 48px;
            background: #223044;
            border: 1px solid #334155;
            border-radius: 14px;
            color: #cbd5e1;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        /* Menu Selection Screen */
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .menu-item {
            background: #181c27;
            border: 1px solid #262d3d;
            border-radius: 14px;
            padding: 14px;
            color: #e2e8f0;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .menu-item:hover {
            border-color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Top Bar -->
    <div class="header">
        <button class="icon-btn" id="btnBack">←</button>
        <div class="header-actions">
            <button class="icon-btn" id="btnSettings">⚙</button>
            <button class="icon-btn" id="btnReset">↻</button>
        </div>
    </div>

    <!-- Status & Info Box -->
    <div class="status-card">
        <div class="status-header">
            <div class="turn-indicator">
                <div class="turn-dot" id="turnDot"></div>
                <span id="turnText">Sizin Növbəniz</span>
            </div>
            <div class="difficulty-badge" id="diffBadge">
                🤖 <span id="diffLabel">Hard</span>
            </div>
        </div>
        <div class="divider"></div>
        <div class="stats-row">
            <div class="stat-group">
                <div class="stat-item">
                    <span class="stat-label">ROUND</span>
                    <span class="stat-value" id="roundText">1 / 3</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">SCORE</span>
                    <span class="stat-value" id="scoreText">0 - 0</span>
                </div>
            </div>
            <div class="wall-counts">
                <div class="wall-pill p1">
                    <div class="wall-icon"></div>
                    <span id="p1Walls">10</span>
                </div>
                <div class="wall-pill p2">
                    <div class="wall-icon"></div>
                    <span id="p2Walls">10</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Game Board -->
    <div class="board-wrapper">
        <div class="board" id="board"></div>
        <div class="walls-container" id="wallsContainer"></div>
    </div>

    <!-- Wall Placement Controls -->
    <div>
        <div class="instruction-text">✨ Maneəni seçib lövhə üzərinə sürüşdürün və ya klikləyin</div>
        <div class="wall-controls">
            <button class="mode-btn active" id="btnHoriz">
                <div class="wall-icon-btn"></div>
                Horizontal
            </button>
            <button class="mode-btn" id="btnVert">
                <div class="wall-icon-btn vertical"></div>
                Vertical
            </button>
        </div>
    </div>
</div>

<!-- Game Mode / Settings Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard">
        <!-- Content Injected Dynamically -->
    </div>
</div>

<script>
/**
 * QUORIDOR GAME ENGINE & AI
 */
const BOARD_SIZE = 9;

// Game State
let gameState = {
    mode: 'vsAI', // 'vsAI', 'local2P', 'onlineRoom', 'onlineMatch'
    difficulty: 'Hard', // 'Easy', 'Medium', 'Hard', 'Master'
    totalRounds: 3,
    currentRound: 1,
    scores: [0, 0],
    p1: { r: 8, c: 4, walls: 10 },
    p2: { r: 0, c: 4, walls: 10 },
    turn: 1, // 1 or 2
    wallMode: 'horizontal', // 'horizontal' or 'vertical'
    hWalls: Array(8).fill(0).map(() => Array(8).fill(false)),
    vWalls: Array(8).fill(0).map(() => Array(8).fill(false)),
    placedWallsList: []
};

// UI Elements
const boardEl = document.getElementById('board');
const wallsContainer = document.getElementById('wallsContainer');
const turnDot = document.getElementById('turnDot');
const turnText = document.getElementById('turnText');
const diffBadge = document.getElementById('diffBadge');
const diffLabel = document.getElementById('diffLabel');
const roundText = document.getElementById('roundText');
const scoreText = document.getElementById('scoreText');
const p1WallsText = document.getElementById('p1Walls');
const p2WallsText = document.getElementById('p2Walls');
const btnHoriz = document.getElementById('btnHoriz');
const btnVert = document.getElementById('btnVert');
const modalOverlay = document.getElementById('modalOverlay');
const modalCard = document.getElementById('modalCard');

// Initialize Board
function initBoardUI() {
    boardEl.innerHTML = '';
    for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            if (r === 0) cell.classList.add('p2-goal');
            if (r === 8) cell.classList.add('p1-goal');
            cell.dataset.row = r;
            cell.dataset.col = c;
            cell.addEventListener('click', () => handleCellClick(r, c));
            boardEl.appendChild(cell);
        }
    }
    renderGame();
}

// Render Game Components
function renderGame() {
    // Clear dynamic highlights and pawns
    document.querySelectorAll('.pawn').forEach(el => el.remove());
    document.querySelectorAll('.cell').forEach(c => c.classList.remove('highlight-target'));

    // Render Pawns
    const p1Cell = getCellEl(gameState.p1.r, gameState.p1.c);
    if (p1Cell) {
        const p1Pawn = document.createElement('div');
        p1Pawn.className = 'pawn p1';
        p1Cell.appendChild(p1Pawn);
    }

    const p2Cell = getCellEl(gameState.p2.r, gameState.p2.c);
    if (p2Cell) {
        const p2Pawn = document.createElement('div');
        p2Pawn.className = 'pawn p2';
        p2Cell.appendChild(p2Pawn);
    }

    // Highlights
    if ((gameState.mode === 'vsAI' && gameState.turn === 1) || gameState.mode !== 'vsAI') {
        const moves = getValidMoves(gameState.turn);
        moves.forEach(m => {
            const cell = getCellEl(m.r, m.c);
            if (cell) cell.classList.add('highlight-target');
        });
    }

    // Render Placed Walls
    wallsContainer.innerHTML = '';
    const rect = boardEl.getBoundingClientRect();
    const cellWidth = (rect.width - 48) / 9; // gap accounted roughly

    gameState.placedWallsList.forEach(w => {
        const wallEl = document.createElement('div');
        wallEl.className = 'placed-wall';
        
        // Calculate coordinates relative to board grid percentage
        const colPercent = (w.c / 9) * 100;
        const rowPercent = (w.r / 9) * 100;

        if (w.type === 'horizontal') {
            wallEl.style.left = `calc(${colPercent}% + 2px)`;
            wallEl.style.top = `calc(${((w.r + 1) / 9) * 100}% - 4px)`;
            wallEl.style.width = `calc(${(2 / 9) * 100}% - 4px)`;
            wallEl.style.height = '8px';
        } else {
            wallEl.style.left = `calc(${((w.c + 1) / 9) * 100}% - 4px)`;
            wallEl.style.top = `calc(${rowPercent}% + 2px)`;
            wallEl.style.width = '8px';
            wallEl.style.height = `calc(${(2 / 9) * 100}% - 4px)`;
        }
        wallsContainer.appendChild(wallEl);
    });

    // Score & Turn Text
    p1WallsText.textContent = gameState.p1.walls;
    p2WallsText.textContent = gameState.p2.walls;
    roundText.textContent = `${gameState.currentRound} / ${gameState.totalRounds}`;
    scoreText.textContent = `${gameState.scores[0]} - ${gameState.scores[1]}`;

    if (gameState.mode === 'vsAI') {
        diffBadge.style.display = 'flex';
        diffLabel.textContent = gameState.difficulty;
        turnText.textContent = gameState.turn === 1 ? 'Sizin Növbəniz' : 'Komputerin Növbəsi';
        turnDot.style.background = gameState.turn === 1 ? '#4ade80' : '#f87171';
    } else {
        diffBadge.style.display = 'none';
        turnText.textContent = `Oyunçu ${gameState.turn} Növbəsi`;
        turnDot.style.background = gameState.turn === 1 ? '#5eead4' : '#f87171';
    }
}

function getCellEl(r, c) {
    return document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
}

// Logic: Movement Validation & Pathfinding (BFS)
function getValidMoves(player) {
    const cur = player === 1 ? gameState.p1 : gameState.p2;
    const opp = player === 1 ? gameState.p2 : gameState.p1;
    const moves = [];

    const dirs = [
        { dr: -1, dc: 0 }, // Up
        { dr: 1, dc: 0 },  // Down
        { dr: 0, dc: -1 }, // Left
        { dr: 0, dc: 1 }   // Right
    ];

    dirs.forEach(d => {
        const nr = cur.r + d.dr;
        const nc = cur.c + d.dc;

        if (nr >= 0 && nr < 9 && nc >= 0 && nc < 9) {
            if (!isWallBetween(cur.r, cur.c, nr, nc)) {
                if (nr === opp.r && nc === opp.c) {
                    // Jump logic
                    const jnr = nr + d.dr;
                    const jnc = nc + d.dc;
                    if (jnr >= 0 && jnr < 9 && jnc >= 0 && jnc < 9 && !isWallBetween(nr, nc, jnr, jnc)) {
                        moves.push({ r: jnr, c: jnc });
                    } else {
                        // Diagonal jumps if direct jump is blocked
                        if (d.dr !== 0) {
                            if (nc - 1 >= 0 && !isWallBetween(nr, nc, nr, nc - 1)) moves.push({ r: nr, c: nc - 1 });
                            if (nc + 1 < 9 && !isWallBetween(nr, nc, nr, nc + 1)) moves.push({ r: nr, c: nc + 1 });
                        } else {
                            if (nr - 1 >= 0 && !isWallBetween(nr, nc, nr - 1, nc)) moves.push({ r: nr - 1, c: nc });
                            if (nr + 1 < 9 && !isWallBetween(nr, nc, nr + 1, nc)) moves.push({ r: nr + 1, c: nc });
                        }
                    }
                } else {
                    moves.push({ r: nr, c: nc });
                }
            }
        }
    });

    return moves;
}

function isWallBetween(r1, c1, r2, c2) {
    if (r1 === r2) { // Horizontal move
        const minC = Math.min(c1, c2);
        if (r1 > 0 && gameState.vWalls[r1 - 1][minC]) return true;
        if (r1 < 8 && gameState.vWalls[r1][minC]) return true;
    } else if (c1 === c2) { // Vertical move
        const minR = Math.min(r1, r2);
        if (c1 > 0 && gameState.hWalls[minR][c1 - 1]) return true;
        if (c1 < 8 && gameState.hWalls[minR][c1]) return true;
    }
    return false;
}

// Wall Validation
function canPlaceWall(r, c, type) {
    if (r < 0 || r >= 8 || c < 0 || c >= 8) return false;
    if (type === 'horizontal') {
        if (gameState.hWalls[r][c]) return false;
        if (c > 0 && gameState.hWalls[r][c - 1]) return false;
        if (c < 7 && gameState.hWalls[r][c + 1]) return false;
        if (gameState.vWalls[r][c]) return false; // Overlap cross
    } else {
        if (gameState.vWalls[r][c]) return false;
        if (r > 0 && gameState.vWalls[r - 1][c]) return false;
        if (r < 7 && gameState.vWalls[r + 1][c]) return false;
        if (gameState.hWalls[r][c]) return false; // Overlap cross
    }

    // Temporarily place wall to check path existence
    if (type === 'horizontal') gameState.hWalls[r][c] = true;
    else gameState.vWalls[r][c] = true;

    const p1Path = getShortestPath(gameState.p1, 0);
    const p2Path = getShortestPath(gameState.p2, 8);

    // Revert
    if (type === 'horizontal') gameState.hWalls[r][c] = false;
    else gameState.vWalls[r][c] = false;

    return p1Path !== null && p2Path !== null;
}

// Shortest Path Finder (BFS)
function getShortestPath(start, goalRow) {
    const queue = [{ r: start.r, c: start.c, dist: 0 }];
    const visited = Array(9).fill(0).map(() => Array(9).fill(false));
    visited[start.r][start.c] = true;

    while (queue.length > 0) {
        const cur = queue.shift();
        if (cur.r === goalRow) return cur.dist;

        const dirs = [{ dr: -1, dc: 0 }, { dr: 1, dc: 0 }, { dr: 0, dc: -1 }, { dr: 0, dc: 1 }];
        for (let d of dirs) {
            const nr = cur.r + d.dr;
            const nc = cur.c + d.dc;
            if (nr >= 0 && nr < 9 && nc >= 0 && nc < 9 && !visited[nr][nc]) {
                if (!isWallBetween(cur.r, cur.c, nr, nc)) {
                    visited[nr][nc] = true;
                    queue.push({ r: nr, c: nc, dist: cur.dist + 1 });
                }
            }
        }
    }
    return null;
}

// Click Handlers
function handleCellClick(r, c) {
    if (gameState.mode === 'vsAI' && gameState.turn === 2) return;

    const validMoves = getValidMoves(gameState.turn);
    const isMove = validMoves.some(m => m.r === r && m.c === c);

    if (isMove) {
        makeMove(gameState.turn, r, c);
    } else {
        // Try placing wall if cell corner is clicked
        const pWalls = gameState.turn === 1 ? gameState.p1.walls : gameState.p2.walls;
        if (pWalls > 0 && r < 8 && c < 8) {
            if (canPlaceWall(r, c, gameState.wallMode)) {
                placeWall(gameState.turn, r, c, gameState.wallMode);
            }
        }
    }
}

function makeMove(player, r, c) {
    if (player === 1) {
        gameState.p1.r = r;
        gameState.p1.c = c;
    } else {
        gameState.p2.r = r;
        gameState.p2.c = c;
    }

    if (checkWin()) return;

    gameState.turn = gameState.turn === 1 ? 2 : 1;
    renderGame();

    if (gameState.mode === 'vsAI' && gameState.turn === 2) {
        setTimeout(aiTurn, 400);
    }
}

function placeWall(player, r, c, type) {
    if (type === 'horizontal') gameState.hWalls[r][c] = true;
    else gameState.vWalls[r][c] = true;

    gameState.placedWallsList.push({ r, c, type });
    if (player === 1) gameState.p1.walls--;
    else gameState.p2.walls--;

    gameState.turn = gameState.turn === 1 ? 2 : 1;
    renderGame();

    if (gameState.mode === 'vsAI' && gameState.turn === 2) {
        setTimeout(aiTurn, 400);
    }
}

function checkWin() {
    if (gameState.p1.r === 0) {
        gameState.scores[0]++;
        showWinnerAlert("Təbrik edirik! Siz qalib gəldiniz!");
        return true;
    }
    if (gameState.p2.r === 8) {
        gameState.scores[1]++;
        showWinnerAlert(gameState.mode === 'vsAI' ? "Komputer qalib gəldi!" : "Oyunçu 2 qalib gəldi!");
        return true;
    }
    return false;
}

function showWinnerAlert(msg) {
    setTimeout(() => {
        alert(msg);
        if (gameState.currentRound < gameState.totalRounds) {
            gameState.currentRound++;
            resetRound();
        } else {
            alert(`Oyun bitdi! Yekun Hesab: ${gameState.scores[0]} - ${gameState.scores[1]}`);
            openMainMenu();
        }
    }, 100);
}

function resetRound() {
    gameState.p1 = { r: 8, c: 4, walls: 10 };
    gameState.p2 = { r: 0, c: 4, walls: 10 };
    gameState.turn = 1;
    gameState.hWalls = Array(8).fill(0).map(() => Array(8).fill(false));
    gameState.vWalls = Array(8).fill(0).map(() => Array(8).fill(false));
    gameState.placedWallsList = [];
    renderGame();
}

// ADVANCED AI ENGINE (Smart, Master Mode & Wall Blocking)
function aiTurn() {
    const p1Dist = getShortestPath(gameState.p1, 0);
    const p2Dist = getShortestPath(gameState.p2, 8);

    // Master/Hard logic: If P1 is closer to winning, attempt blocking wall
    if ((gameState.difficulty === 'Hard' || gameState.difficulty === 'Master') && gameState.p2.walls > 0) {
        if (p1Dist <= p2Dist || gameState.difficulty === 'Master') {
            const bestWall = findBestBlockingWall();
            if (bestWall) {
                placeWall(2, bestWall.r, bestWall.c, bestWall.type);
                return;
            }
        }
    }

    // Easy AI: Random move
    if (gameState.difficulty === 'Easy') {
        const validMoves = getValidMoves(2);
        const randomMove = validMoves[Math.floor(Math.random() * validMoves.length)];
        makeMove(2, randomMove.r, randomMove.c);
        return;
    }

    // Default/Optimal Move using Pathfinding
    const validMoves = getValidMoves(2);
    let bestMove = validMoves[0];
    let minPath = 999;

    validMoves.forEach(m => {
        const oldP2 = { ...gameState.p2 };
        gameState.p2.r = m.r;
        gameState.p2.c = m.c;
        const d = getShortestPath(gameState.p2, 8);
        gameState.p2 = oldP2;

        if (d !== null && d < minPath) {
            minPath = d;
            bestMove = m;
        }
    });

    makeMove(2, bestMove.r, bestMove.c);
}

function findBestBlockingWall() {
    const currentP1Path = getShortestPath(gameState.p1, 0);
    let maxDelay = 0;
    let bestWall = null;

    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            ['horizontal', 'vertical'].forEach(type => {
                if (canPlaceWall(r, c, type)) {
                    if (type === 'horizontal') gameState.hWalls[r][c] = true;
                    else gameState.vWalls[r][c] = true;

                    const newP1Path = getShortestPath(gameState.p1, 0);
                    const newP2Path = getShortestPath(gameState.p2, 8);

                    if (type === 'horizontal') gameState.hWalls[r][c] = false;
                    else gameState.vWalls[r][c] = false;

                    if (newP1Path !== null && newP2Path !== null) {
                        const delay = newP1Path - currentP1Path;
                        if (delay > maxDelay) {
                            maxDelay = delay;
                            bestWall = { r, c, type };
                        }
                    }
                }
            });
        }
    }
    return bestWall;
}

// Modal Screen Views
function openMainMenu() {
    modalCard.innerHTML = `
        <div class="modal-header">
            <div class="modal-title-group">
                <span class="modal-subtitle">QUORIDOR</span>
                <span class="modal-title">Oyun Rejimini Seçin</span>
            </div>
        </div>
        <div class="menu-list">
            <div class="menu-item" onclick="openGameSettings('vsAI')">
                <span>🤖 Komputerə Qarşı</span>
                <span>→</span>
            </div>
            <div class="menu-item" onclick="openGameSettings('local2P')">
                <span>📱 1 Telefonda 2 Nəfər</span>
                <span>→</span>
            </div>
            <div class="menu-item" onclick="openGameSettings('onlineRoom')">
                <span>🏠 Onlayn Otaq (Dostla)</span>
                <span>→</span>
            </div>
            <div class="menu-item" onclick="openGameSettings('onlineMatch')">
                <span>🌐 Xarici Rəqiblə Onlayn</span>
                <span>→</span>
            </div>
        </div>
    `;
    modalOverlay.classList.add('active');
}

function openGameSettings(mode) {
    gameState.mode = mode;
    const isAI = mode === 'vsAI';

    modalCard.innerHTML = `
        <div class="modal-header">
            <button class="icon-btn" onclick="openMainMenu()" style="width:32px;height:32px;">←</button>
            <div class="modal-title-group" style="margin-left:8px;">
                <span class="modal-subtitle">${mode.toUpperCase()}</span>
                <span class="modal-title">Oyun Tənzimləmələri</span>
            </div>
        </div>

        ${isAI ? `
            <div class="section-label">⚡ ÇƏTİNLİK DƏRƏCƏSİ</div>
            <div class="grid-2x2">
                <button class="opt-btn ${gameState.difficulty === 'Easy' ? 'active' : ''}" onclick="setDiff('Easy')">Easy</button>
                <button class="opt-btn ${gameState.difficulty === 'Medium' ? 'active' : ''}" onclick="setDiff('Medium')">Medium</button>
                <button class="opt-btn ${gameState.difficulty === 'Hard' ? 'active' : ''}" onclick="setDiff('Hard')">Hard</button>
                <button class="opt-btn master ${gameState.difficulty === 'Master' ? 'active' : ''}" onclick="setDiff('Master')">⭐ Master</button>
            </div>
        ` : ''}

        <div class="section-label">🔄 RAUND SAYI</div>
        <div class="round-selector">
            <div class="round-opt ${gameState.totalRounds === 1 ? 'active' : ''}" onclick="setRounds(1)">1</div>
            <div class="round-opt ${gameState.totalRounds === 3 ? 'active' : ''}" onclick="setRounds(3)">3</div>
            <div class="round-opt ${gameState.totalRounds === 5 ? 'active' : ''}" onclick="setRounds(5)">5</div>
        </div>

        <button class="start-btn" onclick="startGame()">▶ Oyuna Başla</button>
    `;
}

function setDiff(diff) {
    gameState.difficulty = diff;
    openGameSettings(gameState.mode);
}

function setRounds(r) {
    gameState.totalRounds = r;
    openGameSettings(gameState.mode);
}

function startGame() {
    modalOverlay.classList.remove('active');
    gameState.scores = [0, 0];
    gameState.currentRound = 1;
    resetRound();
}

// Wall Toggle Buttons
btnHoriz.addEventListener('click', () => {
    gameState.wallMode = 'horizontal';
    btnHoriz.classList.add('active');
    btnVert.classList.remove('active');
});

btnVert.addEventListener('click', () => {
    gameState.wallMode = 'vertical';
    btnVert.classList.add('active');
    btnHoriz.classList.remove('active');
});

// Event Listeners for Header
document.getElementById('btnBack').addEventListener('click', openMainMenu);
document.getElementById('btnSettings').addEventListener('click', () => openGameSettings(gameState.mode));
document.getElementById('btnReset').addEventListener('click', resetRound);

// Boot
initBoardUI();
openMainMenu();
</script>
